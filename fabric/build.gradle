// Fabric build of the shared gameplay sources with loader-specific adapters.
plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = rootProject.mod_version
group = rootProject.mod_group_id
base.archivesName = rootProject.mod_id
tasks.named('remapJar') { archiveClassifier = 'fabric' }
tasks.named('jar') { archiveClassifier = 'fabric-dev' }

repositories {
    maven {
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content { includeGroup 'fuzs.forgeconfigapiport' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// Loader classes have matching public seams; gameplay stays in the root sources.
def loaderClasses = [
        'TradeTweaks.java', 'NetworkHandler.java', 'ModItems.java',
        'ModCreativeModeTab.java', 'ModCriteriaTriggers.java', 'ClientKeyMappings.java',
        'Platform.java', 'ClientPlatform.java', 'NeoForgeEvents.java', 'NeoForgeClientEvents.java',
        'ItemRendererMixin.java', 'ChatComponentMixin.java', 'ItemBlockRenderTypesMixin.java',
        'McaInteractionHandler.java', 'WandInteractionHandler.java',
        'VillagerToolInteractionHandler.java', 'RaidRewardHandler.java'
]
// Separate source roots keep IDEA from resolving native classes against Fabric dependencies.
def sharedSources = tasks.register('prepareSharedSources', Sync) {
    from rootProject.file('src/main/java')
    into layout.buildDirectory.dir('generated/sources/shared/java/main')
    exclude { details -> loaderClasses.contains(details.file.name) }
}
sourceSets.main.java.srcDir(sharedSources)
idea.module.generatedSourceDirs.add(layout.buildDirectory.dir('generated/sources/shared/java/main').get().asFile)
tasks.named('ideaSyncTask').configure { dependsOn sharedSources }

loom {
    accessWidenerPath = file('src/main/resources/tradetweaks.accesswidener')
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'tradetweaks.fabric.refmap.json'
    }
    runs {
        client {
            name = 'Trade Tweaks Fabric client'
            ideConfigGenerated = true
        }
        server {
            name = 'Trade Tweaks Fabric server'
            ideConfigGenerated = true
        }
    }
}

// Avoid NeoGradle's dynamic run<Name> rule during IDEA task lookup.
tasks.register('launchFabricClient') {
    group = 'fabric'
    description = 'Starts the Fabric development client.'
    dependsOn tasks.named('runClient')
}
tasks.register('launchFabricServer') {
    group = 'fabric'
    description = 'Starts the Fabric development server.'
    dependsOn tasks.named('runServer')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    // Capture metadata during configuration; copy actions cannot access Project.
    def resourceVersion = project.version.toString()
    from(rootProject.file('src/main/resources')) {
        exclude 'META-INF/**', 'tradetweaks.mixins.json', 'data/tradetweaks/recipe/restoration_bottle.json'
    }
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') { expand version: resourceVersion }
}

apply from: rootProject.file('gameplay-tests.gradle')
